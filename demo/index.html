<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Black Hole Demo</title>
<meta name="description" content="A Schwarzschild black hole with an accretion disk, ray traced live in your browser.">
<style>
  :root {
    --text: #ececf2;
    --muted: #a3a5b8;
    --panel: rgba(12, 12, 20, 0.66);
    --border: rgba(255, 255, 255, 0.13);
    --button: rgba(255, 255, 255, 0.08);
    --button-hover: rgba(255, 255, 255, 0.17);
    --accent: #f2b56b;
  }
  html, body {
    margin: 0;
    height: 100%;
    overflow: hidden;
    background: #000;
    color: var(--text);
    font: 14px/1.45 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  }
  canvas {
    display: block;
    width: 100vw;
    height: 100vh;
    touch-action: none;  /* we handle drag and pinch ourselves */
    cursor: grab;
  }
  canvas.dragging { cursor: grabbing; }
  .panel {
    position: fixed;
    top: 16px;
    left: 16px;
    max-width: min(340px, calc(100vw - 32px));
    box-sizing: border-box;
    padding: 12px 14px;
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 10px;
    backdrop-filter: blur(6px);
  }
  .panel.hidden { display: none; }
  h1 { margin: 0 0 4px; font-size: 16px; font-weight: 600; }
  p { margin: 0 0 10px; color: var(--muted); }
  .buttons { display: flex; flex-wrap: wrap; gap: 6px; }
  button {
    font: inherit;
    color: var(--text);
    background: var(--button);
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 5px 9px;
    cursor: pointer;
  }
  button:hover { background: var(--button-hover); }
  .status { margin-top: 10px; font-size: 12px; color: var(--muted); font-variant-numeric: tabular-nums; }
  a { color: var(--accent); }
  .show-panel {
    position: fixed;
    top: 16px;
    left: 16px;
    display: none;
  }
  .show-panel.visible { display: block; }
  .error {
    position: fixed;
    inset: 0;
    display: none;
    align-items: center;
    justify-content: center;
    padding: 16px;
    text-align: center;
  }
  .error.visible { display: flex; }
</style>
</head>
<body>
<canvas id="view"></canvas>

<div class="panel" id="panel">
  <h1>Black hole, live</h1>
  <p>Light bent by a non-spinning black hole, traced on your GPU, one ray per pixel.
     Drag to orbit, scroll or pinch to zoom.</p>
  <div class="buttons">
    <button id="mode" title="D">Colours: + Doppler</button>
    <button id="sky" title="G">Sky: stars</button>
    <button id="pause" title="Space">Pause disk</button>
    <button id="hide" title="H">Hide</button>
  </div>
  <div class="status" id="status"></div>
  <div class="status">
    <a href="https://github.com/abzakir/blackhole">Source and step-by-step build</a>
    · based on <a href="https://github.com/kavan010/black_hole">Kavan's black hole video</a>
  </div>
</div>
<button class="show-panel" id="show" title="H">Show controls</button>
<div class="error" id="error"></div>

<script id="vertex-shader" type="x-shader/x-vertex">
attribute vec2 a_position;
void main() {
    gl_Position = vec4(a_position, 0.0, 1.0);
}
</script>

<!-- The same shader as steps/06_accretion_disk/blackhole.frag, in WebGL's GLSL dialect. -->
<script id="fragment-shader" type="x-shader/x-fragment">
#ifdef GL_FRAGMENT_PRECISION_HIGH
precision highp float;
#else
precision mediump float;
#endif

uniform vec2 u_resolution;
uniform vec3 u_camPos;
uniform vec3 u_camRight;
uniform vec3 u_camUp;
uniform vec3 u_camForward;
uniform float u_tanHalfFov;
uniform bool u_showGrid;
uniform int u_shiftMode;  // 0 plain, 1 + gravitational redshift, 2 + Doppler as well
uniform float u_time;

const float RS = 1.0;
const float ESCAPE_R = 1000.0;
const float STEP_SCALE = 0.05;
const int MAX_STEPS = 1000;
const float PI = 3.14159265;

const float DISK_IN = 3.0;
const float DISK_OUT = 12.0;
const float DISK_PEAK_T = 4500.0;
const float EXPOSURE = 0.9;
const float TIME_SCALE = 4.0;

// Light bending: with h = |x cross v| constant, this pull traces the same paths as the
// Schwarzschild null geodesic equations.
vec3 acceleration(vec3 x, float h2) {
    float r2 = dot(x, x);
    return -1.5 * RS * h2 * x / (r2 * r2 * sqrt(r2));
}

void rk4Step(inout vec3 x, inout vec3 v, float h2, float dt) {
    vec3 k1x = v;
    vec3 k1v = acceleration(x, h2);
    vec3 k2x = v + 0.5 * dt * k1v;
    vec3 k2v = acceleration(x + 0.5 * dt * k1x, h2);
    vec3 k3x = v + 0.5 * dt * k2v;
    vec3 k3v = acceleration(x + 0.5 * dt * k2x, h2);
    vec3 k4x = v + dt * k3v;
    vec3 k4v = acceleration(x + dt * k3x, h2);
    x += dt / 6.0 * (k1x + 2.0 * k2x + 2.0 * k3x + k4x);
    v += dt / 6.0 * (k1v + 2.0 * k2v + 2.0 * k3v + k4v);
}

float hash(vec3 p) {
    return fract(sin(dot(p, vec3(127.1, 311.7, 74.7))) * 43758.5453);
}

float noise(vec3 p) {
    vec3 i = floor(p);
    vec3 f = fract(p);
    f = f * f * (3.0 - 2.0 * f);
    return mix(mix(mix(hash(i), hash(i + vec3(1.0, 0.0, 0.0)), f.x),
                   mix(hash(i + vec3(0.0, 1.0, 0.0)), hash(i + vec3(1.0, 1.0, 0.0)), f.x), f.y),
               mix(mix(hash(i + vec3(0.0, 0.0, 1.0)), hash(i + vec3(1.0, 0.0, 1.0)), f.x),
                   mix(hash(i + vec3(0.0, 1.0, 1.0)), hash(i + vec3(1.0, 1.0, 1.0)), f.x), f.y), f.z);
}

float clouds(vec3 p) {
    float sum = 0.0;
    float amplitude = 0.5;
    for (int i = 0; i < 4; ++i) {
        sum += amplitude * noise(p);
        p *= 2.03;
        amplitude *= 0.5;
    }
    return sum;
}

vec3 stars(vec3 dir) {
    vec3 color = vec3(0.0);
    for (int layer = 0; layer < 4; ++layer) {
        vec3 cell = floor(dir * (25.0 + 20.0 * float(layer)));
        vec3 seed = cell + 17.0 * float(layer);
        if (hash(seed) > 0.8) {
            vec3 star = cell + 0.5 + 0.5 * (vec3(hash(seed + 1.7), hash(seed + 4.3), hash(seed + 9.1)) - 0.5);
            float angle = length(dir - normalize(star));
            float brightness = 0.12 + 2.5 * pow(hash(seed + 7.7), 8.0);
            vec3 tint = mix(vec3(1.0, 0.78, 0.6), vec3(0.7, 0.82, 1.0), hash(seed + 3.1));
            color += tint * brightness * exp(-angle * angle * 3.0e5);
        }
    }
    return color;
}

vec3 galaxy(vec3 dir) {
    float height = dot(dir, normalize(vec3(0.0, 1.0, 0.45)));
    float glow = exp(-height * height / 0.02) * (0.3 + 0.9 * clouds(dir * 6.0));
    float dust = exp(-height * height / 0.002) * smoothstep(0.4, 0.7, clouds(dir * 12.0 + 3.0));
    return vec3(0.55, 0.5, 0.7) * 0.4 * glow * (1.0 - 0.85 * dust);
}

vec3 skyGrid(vec3 dir) {
    float theta = acos(clamp(dir.y, -1.0, 1.0));
    float phi = atan(dir.z, dir.x);
    float checker = mod(floor(theta / (PI / 12.0)) + floor(phi / (PI / 12.0)), 2.0);
    vec3 base = dir.y > 0.0 ? vec3(0.25, 0.45, 0.85) : vec3(0.85, 0.45, 0.2);
    return base * (0.25 + 0.3 * checker);
}

vec3 blackbody(float kelvin) {
    float t = clamp(kelvin, 1000.0, 40000.0) / 100.0;
    vec3 color;
    color.r = t <= 66.0 ? 1.0 : 1.2929 * pow(t - 60.0, -0.1332);
    color.g = t <= 66.0 ? 0.3901 * log(t) - 0.6318 : 1.1299 * pow(t - 60.0, -0.0755);
    color.b = t >= 66.0 ? 1.0 : (t <= 19.0 ? 0.0 : 0.5432 * log(t - 10.0) - 1.1963);
    return clamp(color, 0.0, 1.0);
}

float temperatureProfile(float r) {
    float x = DISK_IN / r;
    return pow(x, 0.75) * pow(1.0 - sqrt(x), 0.25) / 0.4878;
}

float frequencyShift(float r, float ell, float camF) {
    if (u_shiftMode == 0) {
        return 1.0;
    }
    float uT = 1.0 / sqrt(1.0 - 1.5 * RS / r);
    float omega = sqrt(0.5 * RS / (r * r * r));
    float doppler = u_shiftMode == 2 ? 1.0 - omega * ell : 1.0;
    return 1.0 / (sqrt(camF) * uT * doppler);
}

vec4 diskLight(vec3 p, float ell, float camF) {
    float r = length(p);
    if (r < DISK_IN || r > DISK_OUT) {
        return vec4(0.0);
    }
    float omega = sqrt(0.5 * RS / (r * r * r));
    float angle = atan(p.z, p.x) + omega * u_time * TIME_SCALE;
    float swirl = clouds(vec3(2.0 * cos(angle), 2.0 * sin(angle), 4.0 * r));

    float g = frequencyShift(r, ell, camF);
    float seenT = DISK_PEAK_T * temperatureProfile(r) * g;
    float brightness = pow(seenT / DISK_PEAK_T, 4.0) * (0.45 + 1.1 * swirl);
    vec3 light = blackbody(seenT) * brightness * EXPOSURE;

    float edges = smoothstep(DISK_IN, DISK_IN + 0.3, r) * smoothstep(DISK_OUT, DISK_OUT - 4.0, r);
    float opacity = edges * clamp(0.35 + 0.8 * swirl, 0.0, 1.0);
    return vec4(light * opacity, opacity);
}

vec3 toneMap(vec3 c) {
    return clamp(c * (2.51 * c + 0.03) / (c * (2.43 * c + 0.59) + 0.14), 0.0, 1.0);
}

void main() {
    vec2 uv = (2.0 * gl_FragCoord.xy - u_resolution) / u_resolution.y;
    vec3 dir = normalize(u_camForward + u_tanHalfFov * (uv.x * u_camRight + uv.y * u_camUp));

    vec3 x = u_camPos;
    vec3 radial = normalize(x);
    float camF = 1.0 - RS / length(x);
    vec3 v = normalize(dir + (sqrt(camF) - 1.0) * dot(dir, radial) * radial);
    vec3 angular = cross(x, v);
    float h2 = dot(angular, angular);

    float vr = dot(v, radial);
    float energy = sqrt(vr * vr + camF * h2 / dot(x, x));
    float ell = -angular.y / energy;

    vec3 color = vec3(0.0);
    float transmittance = 1.0;
    bool escaped = false;
    for (int i = 0; i < MAX_STEPS; ++i) {
        float r = length(x);
        if (r < RS) {
            break;
        }
        if (r > ESCAPE_R && dot(x, v) > 0.0) {
            escaped = true;
            break;
        }
        vec3 before = x;
        rk4Step(x, v, h2, STEP_SCALE * r / length(v));

        if (before.y * x.y < 0.0) {
            vec3 hit = mix(before, x, before.y / (before.y - x.y));
            vec4 disk = diskLight(hit, ell, camF);
            color += transmittance * disk.rgb;
            transmittance *= 1.0 - disk.a;
            if (transmittance < 0.01) {
                break;
            }
        }
    }

    if (escaped) {
        vec3 skyDir = normalize(v);
        color += transmittance * (u_showGrid ? skyGrid(skyDir) : galaxy(skyDir) + stars(skyDir));
    }
    gl_FragColor = vec4(toneMap(color), 1.0);
}
</script>

<script>
"use strict";

const MODE_NAMES = ["plain", "+ redshift", "+ Doppler"];
const FOV_Y = 60 * Math.PI / 180;

const canvas = document.getElementById("view");
const statusLine = document.getElementById("status");

function fail(message) {
    const box = document.getElementById("error");
    box.textContent = message;
    box.classList.add("visible");
    document.getElementById("panel").classList.add("hidden");
    throw new Error(message);
}

const gl = canvas.getContext("webgl", { antialias: false, alpha: false, powerPreference: "high-performance" });
if (!gl) {
    fail("Your browser doesn't support WebGL, which this demo needs.");
}

// ---- shaders ----

function compile(type, id) {
    const shader = gl.createShader(type);
    gl.shaderSource(shader, document.getElementById(id).textContent);
    gl.compileShader(shader);
    if (!gl.getShaderParameter(shader, gl.COMPILE_STATUS)) {
        fail("Shader error: " + gl.getShaderInfoLog(shader));
    }
    return shader;
}

const program = gl.createProgram();
gl.attachShader(program, compile(gl.VERTEX_SHADER, "vertex-shader"));
gl.attachShader(program, compile(gl.FRAGMENT_SHADER, "fragment-shader"));
gl.linkProgram(program);
if (!gl.getProgramParameter(program, gl.LINK_STATUS)) {
    fail("Shader link error: " + gl.getProgramInfoLog(program));
}
gl.useProgram(program);

// One triangle big enough to cover the whole screen: the shader runs for every pixel under it.
gl.bindBuffer(gl.ARRAY_BUFFER, gl.createBuffer());
gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1, -1, 3, -1, -1, 3]), gl.STATIC_DRAW);
const positionLocation = gl.getAttribLocation(program, "a_position");
gl.enableVertexAttribArray(positionLocation);
gl.vertexAttribPointer(positionLocation, 2, gl.FLOAT, false, 0, 0);

const uniform = {};
for (const name of ["u_resolution", "u_camPos", "u_camRight", "u_camUp", "u_camForward",
                    "u_tanHalfFov", "u_showGrid", "u_shiftMode", "u_time"]) {
    uniform[name] = gl.getUniformLocation(program, name);
}

// ---- state (the URL can set the starting view, e.g. ?distance=14&mode=1&grid) ----

const params = new URLSearchParams(location.search);
const camera = {
    distance: clamp(parseFloat(params.get("distance")) || 20, 2.5, 80),
    azimuth: parseFloat(params.get("azimuth")) || 0,
    elevation: clamp(parseFloat(params.get("elevation")) || 0.1, -1.5, 1.5),
};
let shiftMode = params.has("mode") ? clamp(parseInt(params.get("mode"), 10) || 0, 0, 2) : 2;
let showGrid = params.has("grid");
let paused = params.has("paused");
let simTime = parseFloat(params.get("time")) || 0;

function clamp(value, low, high) {
    return Math.min(high, Math.max(low, value));
}

// ---- camera: same maths as steps/06_accretion_disk/main.cpp ----

function normalize(v) {
    const length = Math.hypot(v[0], v[1], v[2]);
    return [v[0] / length, v[1] / length, v[2] / length];
}

function cross(a, b) {
    return [a[1] * b[2] - a[2] * b[1], a[2] * b[0] - a[0] * b[2], a[0] * b[1] - a[1] * b[0]];
}

function setCameraUniforms() {
    const { distance, azimuth, elevation } = camera;
    const position = [distance * Math.cos(elevation) * Math.cos(azimuth),
                      distance * Math.sin(elevation),
                      distance * Math.cos(elevation) * Math.sin(azimuth)];
    const forward = normalize([-position[0], -position[1], -position[2]]);
    const right = normalize(cross(forward, [0, 1, 0]));
    const up = cross(right, forward);
    gl.uniform3fv(uniform.u_camPos, position);
    gl.uniform3fv(uniform.u_camRight, right);
    gl.uniform3fv(uniform.u_camUp, up);
    gl.uniform3fv(uniform.u_camForward, forward);
    gl.uniform1f(uniform.u_tanHalfFov, Math.tan(FOV_Y / 2));
}

// ---- resolution: draw fewer pixels on slow GPUs, and let CSS stretch the canvas ----

const maxPixelRatio = Math.min(window.devicePixelRatio || 1, 1.5);
let renderScale = params.has("scale") ? clamp(parseFloat(params.get("scale")) || 1, 0.25, 1) : 1;
const adaptiveScale = !params.has("scale");

function resize() {
    const width = Math.max(1, Math.round(window.innerWidth * maxPixelRatio * renderScale));
    const height = Math.max(1, Math.round(window.innerHeight * maxPixelRatio * renderScale));
    if (canvas.width !== width || canvas.height !== height) {
        canvas.width = width;
        canvas.height = height;
        gl.viewport(0, 0, width, height);
    }
}
window.addEventListener("resize", resize);
resize();

// ---- frame loop ----

let lastTime = null;
let windowStart = null;
let windowFrames = 0;
let fps = 0;
let fastWindows = 0;

function frame(now) {
    if (lastTime !== null && !paused) {
        simTime += Math.min(0.1, (now - lastTime) / 1000);
    }
    lastTime = now;

    setCameraUniforms();
    gl.uniform2f(uniform.u_resolution, canvas.width, canvas.height);
    gl.uniform1i(uniform.u_showGrid, showGrid ? 1 : 0);
    gl.uniform1i(uniform.u_shiftMode, shiftMode);
    gl.uniform1f(uniform.u_time, simTime);
    gl.drawArrays(gl.TRIANGLES, 0, 3);

    // Every half second: measure the frame rate and adjust the resolution if needed.
    windowFrames++;
    if (windowStart === null) {
        windowStart = now;
    } else if (now - windowStart >= 500) {
        fps = windowFrames * 1000 / (now - windowStart);
        windowStart = now;
        windowFrames = 0;
        // Browsers slow down background tabs, which would look like a slow GPU, so only adapt when visible.
        if (adaptiveScale && !document.hidden) {
            if (fps < 30 && renderScale > 0.3) {
                renderScale = Math.max(0.3, renderScale * 0.8);
                fastWindows = 0;
                resize();
            } else if (fps > 55 && renderScale < 1) {
                if (++fastWindows >= 4) {  // wait for two steady seconds before trying more pixels
                    renderScale = Math.min(1, renderScale * 1.15);
                    fastWindows = 0;
                    resize();
                }
            } else {
                fastWindows = 0;
            }
        }
        updateStatus();
    }
    requestAnimationFrame(frame);
}

function updateStatus() {
    statusLine.textContent = `r = ${camera.distance.toFixed(1)} r_s · ${Math.round(fps)} fps · ` +
        `${canvas.width}×${canvas.height} (${Math.round(renderScale * 100)}% resolution)`;
}

// ---- controls ----

const modeButton = document.getElementById("mode");
const skyButton = document.getElementById("sky");
const pauseButton = document.getElementById("pause");
const panel = document.getElementById("panel");
const showButton = document.getElementById("show");

function refreshButtons() {
    modeButton.textContent = "Colours: " + MODE_NAMES[shiftMode];
    skyButton.textContent = "Sky: " + (showGrid ? "grid" : "stars");
    pauseButton.textContent = paused ? "Play disk" : "Pause disk";
}

function cycleMode() { shiftMode = (shiftMode + 1) % 3; refreshButtons(); }
function toggleSky() { showGrid = !showGrid; refreshButtons(); }
function togglePause() { paused = !paused; refreshButtons(); }
function togglePanel() {
    panel.classList.toggle("hidden");
    showButton.classList.toggle("visible", panel.classList.contains("hidden"));
}

modeButton.addEventListener("click", cycleMode);
skyButton.addEventListener("click", toggleSky);
pauseButton.addEventListener("click", togglePause);
document.getElementById("hide").addEventListener("click", togglePanel);
showButton.addEventListener("click", togglePanel);

window.addEventListener("keydown", (event) => {
    if (event.target instanceof HTMLButtonElement && (event.key === " " || event.key === "Enter")) {
        return;  // let a focused button handle its own activation
    }
    const key = event.key.toLowerCase();
    if (key === "d") cycleMode();
    else if (key === "g") toggleSky();
    else if (key === "h") togglePanel();
    else if (key === " ") { togglePause(); event.preventDefault(); }
});

// Drag with one finger or the mouse to orbit, pinch with two fingers to zoom.
const pointers = new Map();
let pinchDistance = null;

function zoom(factor) {
    camera.distance = clamp(camera.distance * factor, 2.5, 80);
}

canvas.addEventListener("pointerdown", (event) => {
    canvas.setPointerCapture(event.pointerId);
    pointers.set(event.pointerId, { x: event.clientX, y: event.clientY });
    canvas.classList.add("dragging");
    pinchDistance = null;
});

canvas.addEventListener("pointermove", (event) => {
    const previous = pointers.get(event.pointerId);
    if (!previous) {
        return;
    }
    const current = { x: event.clientX, y: event.clientY };
    pointers.set(event.pointerId, current);

    if (pointers.size === 1) {
        camera.azimuth += 0.005 * (current.x - previous.x);
        camera.elevation = clamp(camera.elevation + 0.005 * (current.y - previous.y), -1.5, 1.5);
    } else if (pointers.size === 2) {
        const [a, b] = [...pointers.values()];
        const spread = Math.hypot(a.x - b.x, a.y - b.y);
        if (pinchDistance !== null && spread > 0) {
            zoom(pinchDistance / spread);
        }
        pinchDistance = spread;
    }
});

function endPointer(event) {
    pointers.delete(event.pointerId);
    pinchDistance = null;
    if (pointers.size === 0) {
        canvas.classList.remove("dragging");
    }
}
canvas.addEventListener("pointerup", endPointer);
canvas.addEventListener("pointercancel", endPointer);

canvas.addEventListener("wheel", (event) => {
    event.preventDefault();
    zoom(Math.pow(1.0015, event.deltaY));  // scroll down to move away, up to move closer
}, { passive: false });

refreshButtons();
updateStatus();
requestAnimationFrame(frame);
</script>
</body>
</html>
